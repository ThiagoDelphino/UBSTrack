# Roda os testes das APIs em todo PR para develop/main e em todo push nelas.
# O resultado aparece como check no PR (Settings > Rules: marcar "backend" como obrigatório).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: backend (${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [painel-api, simulador-api]
    defaults:
      run:
        working-directory: ${{ matrix.api }}
    env:
      # Os testes não acessam o banco; esta URL só precisa existir para o app importar.
      DATABASE_URL: postgresql+psycopg2://teste:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.api }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Roda as migrations num PostgreSQL de verdade e testa cada API contra ele,
  # com o usuário de banco da própria API (valida também as permissões).
  integracao:
    name: integração (${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: painel-api
            usuario: painel_leitura
            senha: painel_ci
          - api: simulador-api
            usuario: simulador_escrita
            senha: simulador_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: ubstrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ubstrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg2://admin:admin@localhost:5432/ubstrack
      PAINEL_DB_PASSWORD: painel_ci
      SIMULADOR_DB_PASSWORD: simulador_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            database/requirements.txt
            ${{ matrix.api }}/requirements.txt
      - name: Aplicar as migrations
        working-directory: database
        env:
          DATABASE_URL: postgresql+psycopg2://admin:admin@localhost:5432/ubstrack
        run: |
          pip install -r requirements.txt
          alembic upgrade head
      - name: Testes de integração
        working-directory: ${{ matrix.api }}
        env:
          DATABASE_URL: postgresql+psycopg2://${{ matrix.usuario }}:${{ matrix.senha }}@localhost:5432/ubstrack
        run: |
          pip install -r requirements.txt
          pytest tests/integration -q
