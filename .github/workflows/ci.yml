# Roda os testes das APIs em todo PR para develop/main e em todo push nelas.
# O resultado aparece como check no PR (Settings > Rules: marcar "backend" como obrigatório).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: backend (${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [painel-api, simulador-api]
    defaults:
      run:
        working-directory: ${{ matrix.api }}
    env:
      # Os testes não acessam o banco; esta URL só precisa existir para o app importar.
      DATABASE_URL: postgresql+psycopg2://teste:teste@localhost:5432/teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.api }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
