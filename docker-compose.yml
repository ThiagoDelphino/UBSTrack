# Sobe o projeto inteiro com: docker compose up --build
#
# Ordem de inicialização:
#   db  ->  migrate (aplica as migrations e termina)  ->  APIs  ->  frontends
#
# As variáveis ${...} vêm do arquivo .env na raiz (copie do .env.example).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./database
    environment:
      # Usuário ADMINISTRADOR: o único que cria tabelas e usuários de banco.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAINEL_DB_PASSWORD: ${PAINEL_DB_PASSWORD}
      SIMULADOR_DB_PASSWORD: ${SIMULADOR_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  painel-api:
    build: ./painel-api
    environment:
      # Usuário SOMENTE LEITURA.
      DATABASE_URL: postgresql+psycopg2://painel_leitura:${PAINEL_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./painel-api:/app  # o código da sua máquina aparece no container: salvou, recarregou
    depends_on:
      migrate:
        condition: service_completed_successfully

  simulador-api:
    build: ./simulador-api
    environment:
      # Usuário COM ESCRITA na tabela atendimento.
      DATABASE_URL: postgresql+psycopg2://simulador_escrita:${SIMULADOR_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:5174
    ports:
      - "8001:8000"
    volumes:
      - ./simulador-api:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  painel-web:
    build: ./painel-web
    environment:
      # Endereço que o NAVEGADOR usa para chegar na API (por isso localhost, e não painel-api).
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./painel-web:/app
      - /app/node_modules  # mantém o node_modules do container, não o da sua máquina
    depends_on:
      - painel-api

  simulador-web:
    build: ./simulador-web
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5174:5174"
    volumes:
      - ./simulador-web:/app
      - /app/node_modules
    depends_on:
      - simulador-api

volumes:
  pgdata:
